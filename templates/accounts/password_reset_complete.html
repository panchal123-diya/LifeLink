{% extends 'base.html' %}

{% block title %}Password Changed - HealthBridge{% endblock %}

{% block content %}
<div class="container mt-5 pt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 glass-card">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <i class="fa-solid fa-check-circle fa-4x text-success mb-3"></i>
                        <h2 class="fw-bold">Password Updated</h2>
                        <p class="text-muted">Your password has been successfully set. You may go ahead and log in now.</p>
                    </div>
                    
                    <div class="mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary rounded-pill px-5 btn-lg shadow-sm fw-bold">Log In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
